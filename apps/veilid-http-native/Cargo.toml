[package]
name = "veilid-http-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
veilid-http-core = { path = "../../crates/veilid-http-core" }
veilid-http-engine = { path = "../../crates/veilid-http-engine" }
veilid-http-http = { path = "../../crates/veilid-http-http" }
veilid-http-ipc = { path = "../../crates/veilid-http-ipc" }
veilid-http-route = { path = "../../crates/veilid-http-route" }
veilid-http-stream = { path = "../../crates/veilid-http-stream" }
veilid-http-transport = { path = "../../crates/veilid-http-transport" }
veilid-http-veilid-native = { path = "../../crates/veilid-http-veilid-native" }
veilid-http-wire = { path = "../../crates/veilid-http-wire" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# The buffered convenience surface remains available for native harnesses during alpha.
dead_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
# These cohesive IPC and streaming state-machine loops are clearer kept together.
too_many_lines = "allow"
collapsible_if = "allow"
single_match_else = "allow"
# These names mirror the serialized IPC vocabulary consumed by Electron.
enum_variant_names = "allow"
struct_field_names = "allow"
redundant_closure = "allow"
