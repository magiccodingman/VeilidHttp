name: Fix Veilid 0.5.5 targets

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/complete-veilid-http'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Use the pinned Target::RouteId variant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('crates/veilid-http-veilid-native/src/lib.rs'),
              Path('crates/veilid-http-veilid-remote/src/lib.rs'),
          ]
          for path in paths:
              text = path.read_text()
              count = text.count('Target::PrivateRoute(')
              if count != 2:
                  raise SystemExit(f'{path}: expected 2 PrivateRoute targets, found {count}')
              path.write_text(text.replace('Target::PrivateRoute(', 'Target::RouteId('))
          PY
      - name: Commit fix and remove helper
        run: |
          git rm .github/workflows/fix-v055-target.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veilid-http-veilid-native/src/lib.rs crates/veilid-http-veilid-remote/src/lib.rs
          git commit -m "Use Veilid 0.5.5 RouteId targets"
          git push origin HEAD:agent/complete-veilid-http
