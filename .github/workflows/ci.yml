name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  electron-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - name: Generate updated lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload tested lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hardened-pnpm-lock
          path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veilid-http/electron test
      - run: pnpm --filter @veilid-http/electron build
      - run: node scripts/smoke-http-fixtures.mjs
      - name: Verify service workers, storage, CORS, and streams on localhost origins
        run: xvfb-run -a pnpm --filter @veilid-http/electron exec electron --no-sandbox test/electron-pwa-smoke.cjs
        timeout-minutes: 2
      - name: Prepare packaged transport fixture
        run: |
          mkdir -p target/release
          printf '#!/bin/sh\nexit 1\n' > target/release/veilid-http-native
          chmod +x target/release/veilid-http-native
      - name: Package hardened Electron client
        run: pnpm --filter @veilid-http/electron package -- --platform=linux --arch=x64
      - name: Report packaged Electron fuses
        run: |
          app_dir="$(find "$GITHUB_WORKSPACE/apps/veilid-http-electron/out" -mindepth 1 -maxdepth 1 -type d -name '*-linux-*' -print -quit)"
          binary="$app_dir/veilid-http"
          test -x "$binary"
          pnpm --filter @veilid-http/electron exec electron-fuses read --app "$binary"
