name: CI

on:
  push:
    branches: [main, agent/complete-veilid-http]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  normalize-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/complete-veilid-http'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - name: Normalize source and lockfiles
        run: |
          cargo generate-lockfile
          cargo fmt --all
          pnpm install --lockfile-only --frozen-lockfile=false
      - name: Commit normalized repository state
        run: |
          if git diff --quiet --exit-code -- '*.rs' Cargo.lock pnpm-lock.yaml; then
            echo "Repository state is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' Cargo.lock pnpm-lock.yaml
          git commit -m "Normalize Rust sources and lockfiles"
          git push origin HEAD:agent/complete-veilid-http

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report runner context
        run: uname -a && git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo metadata --no-deps --format-version 1 >/dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report runner context
        run: uname -a && git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - run: node -e "for (const p of ['package.json','apps/veilid-http-electron/package.json']) JSON.parse(require('node:fs').readFileSync(p, 'utf8'))"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veilid-http/electron test
      - run: pnpm --filter @veilid-http/electron build
      - run: node scripts/smoke-http-fixtures.mjs
      - name: Verify service workers, storage, CORS, and streams on veilid://
        run: xvfb-run -a pnpm --filter @veilid-http/electron exec electron --no-sandbox test/electron-pwa-smoke.cjs
        timeout-minutes: 2

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml -f dev-compose.yaml config >/dev/null
      - run: sh -n docker/entrypoint.sh docker/entrypoint.dev.sh docker/healthcheck.sh scripts/validate-route-lifecycle.sh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: veilid-http:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
