name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refactor-outbound-config:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/complete-veilid-http'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Refactor outbound stream construction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) < count:
                  raise SystemExit(f"expected text not found {count} time(s) in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count))

          replace(
              "crates/veilid-http-engine/src/outgoing.rs",
              """/// Bounded outgoing logical body stream.
          #[derive(Debug)]
          pub struct OutboundBody {""",
              """/// Configuration for one bounded outgoing logical body stream.
          #[derive(Debug, Clone, Copy)]
          pub struct OutboundBodyConfig {
              /// Per-stream compression mode.
              pub compression: CompressionMode,
              /// Zstandard compression level when compression is enabled.
              pub zstd_level: i32,
              /// Maximum complete VHTTP frame size.
              pub frame_limit: usize,
              /// Bytes reserved for frame metadata when calculating payload capacity.
              pub reserved_metadata: usize,
              /// Local frame window, from 1 through 64.
              pub window_frames: usize,
              /// Hard bound for pending and retransmission bytes owned by the stream.
              pub max_pending_bytes: usize,
          }

          /// Bounded outgoing logical body stream.
          #[derive(Debug)]
          pub struct OutboundBody {""",
          )
          replace(
              "crates/veilid-http-engine/src/outgoing.rs",
              """    pub fn new(
                  transaction_id: [u8; 16],
                  direction: StreamDirection,
                  compression: CompressionMode,
                  zstd_level: i32,
                  frame_limit: usize,
                  reserved_metadata: usize,
                  window_frames: usize,
                  max_pending_bytes: usize,
              ) -> Result<Self, EngineError> {
                  if window_frames == 0 || window_frames > 64 {""",
              """    pub fn new(
                  transaction_id: [u8; 16],
                  direction: StreamDirection,
                  config: OutboundBodyConfig,
              ) -> Result<Self, EngineError> {
                  let OutboundBodyConfig {
                      compression,
                      zstd_level,
                      frame_limit,
                      reserved_metadata,
                      window_frames,
                      max_pending_bytes,
                  } = config;
                  if window_frames == 0 || window_frames > 64 {""",
          )
          replace(
              "crates/veilid-http-engine/src/outgoing.rs",
              """        if flush {
                      if let Some(payload) = self.batcher.flush() {
                          self.queue(PendingItem::Data(payload))?;
                      }
                  }""",
              """        if flush && let Some(payload) = self.batcher.flush() {
                      self.queue(PendingItem::Data(payload))?;
                  }""",
          )
          replace(
              "crates/veilid-http-engine/src/error.rs",
              """    InputChunkTooLarge { actual: usize, limit: usize },""",
              """    InputChunkTooLarge {
                  /// Logical input bytes supplied by the caller.
                  actual: usize,
                  /// Maximum logical bytes accepted by one push.
                  limit: usize,
              },""",
          )
          replace(
              "crates/veilid-http-engine/src/error.rs",
              """    PendingLimit { actual: usize, limit: usize },""",
              """    PendingLimit {
                  /// Pending and retained bytes after the rejected operation.
                  actual: usize,
                  /// Configured maximum buffered bytes.
                  limit: usize,
              },""",
          )
          replace(
              "crates/veilid-http-engine/src/lib.rs",
              "pub use outgoing::{OutboundBody, RetainedFrame};",
              "pub use outgoing::{OutboundBody, OutboundBodyConfig, RetainedFrame};",
          )
          replace(
              "apps/veilid-http-native/src/runtime.rs",
              "use veilid_http_engine::{InboundBody, OutboundBody};",
              "use veilid_http_engine::{InboundBody, OutboundBody, OutboundBodyConfig};",
          )
          replace(
              "apps/veilid-http-native/src/runtime.rs",
              """            let mut sender = OutboundBody::new(
                          transaction_id,
                          StreamDirection::Request,
                          CompressionMode::Zstd,
                          3,
                          self.frame_bytes,
                          256,
                          self.window_frames,
                          self.max_pending_bytes,
                      )?;""",
              """            let mut sender = OutboundBody::new(
                          transaction_id,
                          StreamDirection::Request,
                          OutboundBodyConfig {
                              compression: CompressionMode::Zstd,
                              zstd_level: 3,
                              frame_limit: self.frame_bytes,
                              reserved_metadata: 256,
                              window_frames: self.window_frames,
                              max_pending_bytes: self.max_pending_bytes,
                          },
                      )?;""",
          )
          replace(
              "apps/veilid-http-bridge/src/streaming.rs",
              "use veilid_http_engine::{InboundBody, OutboundBody};",
              "use veilid_http_engine::{InboundBody, OutboundBody, OutboundBodyConfig};",
          )
          replace(
              "apps/veilid-http-bridge/src/streaming.rs",
              """        let mut outbound = OutboundBody::new(
                      transaction_id,
                      StreamDirection::Response,
                      CompressionMode::Zstd,
                      3,
                      self.config.frame_bytes,
                      256,
                      usize::try_from(self.config.window_frames).unwrap_or(32),
                      self.config.max_pending_bytes,
                  )?;""",
              """        let mut outbound = OutboundBody::new(
                      transaction_id,
                      StreamDirection::Response,
                      OutboundBodyConfig {
                          compression: CompressionMode::Zstd,
                          zstd_level: 3,
                          frame_limit: self.config.frame_bytes,
                          reserved_metadata: 256,
                          window_frames: usize::try_from(self.config.window_frames).unwrap_or(32),
                          max_pending_bytes: self.config.max_pending_bytes,
                      },
                  )?;""",
          )
          replace(
              "crates/veilid-http-engine/tests/faults.rs",
              "use veilid_http_engine::{InboundBody, OutboundBody};",
              "use veilid_http_engine::{InboundBody, OutboundBody, OutboundBodyConfig};",
          )
          replacements = [
              (
                  """        CompressionMode::None,
                      0,
                      1024,
                      128,
                      8,
                      64 * 1024,""",
                  """        OutboundBodyConfig {
                          compression: CompressionMode::None,
                          zstd_level: 0,
                          frame_limit: 1024,
                          reserved_metadata: 128,
                          window_frames: 8,
                          max_pending_bytes: 64 * 1024,
                      },""",
              ),
              (
                  """        CompressionMode::Zstd,
                      3,
                      2048,
                      256,
                      8,
                      1024 * 1024,""",
                  """        OutboundBodyConfig {
                          compression: CompressionMode::Zstd,
                          zstd_level: 3,
                          frame_limit: 2048,
                          reserved_metadata: 256,
                          window_frames: 8,
                          max_pending_bytes: 1024 * 1024,
                      },""",
              ),
              (
                  """        CompressionMode::None,
                      0,
                      1024,
                      128,
                      4,
                      16 * 1024,""",
                  """        OutboundBodyConfig {
                          compression: CompressionMode::None,
                          zstd_level: 0,
                          frame_limit: 1024,
                          reserved_metadata: 128,
                          window_frames: 4,
                          max_pending_bytes: 16 * 1024,
                      },""",
              ),
          ]
          for old, new in replacements:
              replace("crates/veilid-http-engine/tests/faults.rs", old, new)
          PY
          cargo fmt --all
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/veilid-http-engine/src/outgoing.rs \
            crates/veilid-http-engine/src/error.rs \
            crates/veilid-http-engine/src/lib.rs \
            crates/veilid-http-engine/tests/faults.rs \
            apps/veilid-http-native/src/runtime.rs \
            apps/veilid-http-bridge/src/streaming.rs
          git commit -m "Introduce outbound stream configuration"
          git push origin HEAD:agent/complete-veilid-http

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report runner context
        run: uname -a && git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report runner context
        run: uname -a && git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - run: node -e "for (const p of ['package.json','apps/veilid-http-electron/package.json']) JSON.parse(require('node:fs').readFileSync(p, 'utf8'))"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veilid-http/electron test
      - run: pnpm --filter @veilid-http/electron build
      - run: node scripts/smoke-http-fixtures.mjs
      - name: Verify service workers, storage, CORS, and streams on localhost origins
        run: xvfb-run -a pnpm --filter @veilid-http/electron exec electron --no-sandbox test/electron-pwa-smoke.cjs
        timeout-minutes: 2

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml -f dev-compose.yaml config >/dev/null
      - run: sh -n docker/entrypoint.sh docker/entrypoint.dev.sh docker/healthcheck.sh scripts/validate-route-lifecycle.sh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: veilid-http:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
