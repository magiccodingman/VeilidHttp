name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  document-stream-enums:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/complete-veilid-http'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Document public streaming enum fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/veilid-http-stream/src/lib.rs')
          text = path.read_text()
          replacements = {
          '''    RequestOpen {
                  transaction_id: [u8; 16],
                  value: RequestOpen,
                  initial_payload: Bytes,
              },''': '''    RequestOpen {
                  /// Transaction identifier.
                  transaction_id: [u8; 16],
                  /// Decoded request opening metadata.
                  value: RequestOpen,
                  /// Optional initial encoded body bytes carried by the opening frame.
                  initial_payload: Bytes,
              },''',
          '''    RequestAccepted {
                  transaction_id: [u8; 16],
                  value: RequestAccepted,
              },''': '''    RequestAccepted {
                  /// Transaction identifier.
                  transaction_id: [u8; 16],
                  /// Server acceptance and negotiated receive-window metadata.
                  value: RequestAccepted,
              },''',
          '''    ResponseOpen {
                  transaction_id: [u8; 16],
                  value: ResponseOpen,
                  initial_payload: Bytes,
              },''': '''    ResponseOpen {
                  /// Transaction identifier.
                  transaction_id: [u8; 16],
                  /// Decoded response opening metadata.
                  value: ResponseOpen,
                  /// Optional initial encoded response-body bytes.
                  initial_payload: Bytes,
              },''',
          '''    End {
                  transaction_id: [u8; 16],
                  sequence: u32,
                  value: StreamEnd,
              },''': '''    End {
                  /// Transaction identifier.
                  transaction_id: [u8; 16],
                  /// Sequence number immediately following the final data frame.
                  sequence: u32,
                  /// Final length, digest, and direction metadata.
                  value: StreamEnd,
              },''',
          '''    Ack {
                  transaction_id: [u8; 16],
                  value: Ack,
              },''': '''    Ack {
                  /// Transaction identifier.
                  transaction_id: [u8; 16],
                  /// Cumulative and selective acknowledgement metadata.
                  value: Ack,
              },''',
          '''    Cancel {
                  transaction_id: [u8; 16],
                  value: Cancel,
              },''': '''    Cancel {
                  /// Transaction identifier.
                  transaction_id: [u8; 16],
                  /// Cancellation reason metadata.
                  value: Cancel,
              },''',
          '''    Error {
                  transaction_id: [u8; 16],
                  value: StreamError,
              },''': '''    Error {
                  /// Transaction identifier.
                  transaction_id: [u8; 16],
                  /// Structured protocol or upstream error metadata.
                  value: StreamError,
              },''',
          '''    LogicalLimit { actual: u64, limit: u64 },''': '''    LogicalLimit {
                  /// Logical bytes observed or declared.
                  actual: u64,
                  /// Configured maximum logical bytes.
                  limit: u64,
              },''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected text not found: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veilid-http-stream/src/lib.rs
          git commit -m "Document streaming protocol enum fields"
          git push origin HEAD:agent/complete-veilid-http

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report runner context
        run: uname -a && git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Report runner context
        run: uname -a && git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - run: node -e "for (const p of ['package.json','apps/veilid-http-electron/package.json']) JSON.parse(require('node:fs').readFileSync(p, 'utf8'))"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veilid-http/electron test
      - run: pnpm --filter @veilid-http/electron build
      - run: node scripts/smoke-http-fixtures.mjs
      - name: Verify service workers, storage, CORS, and streams on localhost origins
        run: xvfb-run -a pnpm --filter @veilid-http/electron exec electron --no-sandbox test/electron-pwa-smoke.cjs
        timeout-minutes: 2

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f compose.yaml -f dev-compose.yaml config >/dev/null
      - run: sh -n docker/entrypoint.sh docker/entrypoint.dev.sh docker/healthcheck.sh scripts/validate-route-lifecycle.sh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: veilid-http:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
