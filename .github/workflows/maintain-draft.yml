name: Maintain draft workspace

on:
  push:
    branches: [agent/initial-veilid-http]

permissions:
  contents: write

jobs:
  format-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: agent/initial-veilid-http
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - name: Format Rust and generate lockfiles
        run: |
          cargo fmt --all
          cargo generate-lockfile
          pnpm install --lockfile-only
      - name: Commit generated maintenance changes
        run: |
          if git diff --quiet -- Cargo.lock pnpm-lock.yaml '*.rs'; then
            echo 'Workspace already formatted and locked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock pnpm-lock.yaml
          git add -- '*.rs'
          git commit -m 'Apply rustfmt and commit lockfiles'
          git push origin HEAD:agent/initial-veilid-http
