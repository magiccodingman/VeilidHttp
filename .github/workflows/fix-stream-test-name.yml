name: Fix stream test variable

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/complete-veilid-http'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Rename ambiguous test binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/veilid-http-stream/src/lib.rs')
          text = path.read_text()
          first = 'let encoded = encoder.push(b"hello", false).unwrap();'
          second = 'decoder.push(&encoded, false).unwrap()'
          if first not in text or second not in text:
              raise SystemExit('expected stream test bindings were not found')
          text = text.replace(first, 'let compressed = encoder.push(b"hello", false).unwrap();', 1)
          text = text.replace(second, 'decoder.push(&compressed, false).unwrap()', 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veilid-http-stream/src/lib.rs
          git commit -m "Clarify stream corruption test naming"
          git push origin HEAD:agent/complete-veilid-http
