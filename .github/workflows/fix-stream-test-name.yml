name: Fix stream test variable

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/complete-veilid-http'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Rename ambiguous test binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/veilid-http-stream/src/lib.rs')
          text = path.read_text()
          old = '''        let encoded = encoder.push(b"hello", false).unwrap();
          let (_, mut end) = encoder.finish().unwrap();'''
          new = '''        let compressed = encoder.push(b"hello", false).unwrap();
          let (_, mut end) = encoder.finish().unwrap();'''
          if old not in text:
              print('rename already applied')
          else:
              text = text.replace(old, new, 1)
              text = text.replace('decoder.push(&encoded, false).unwrap()', 'decoder.push(&compressed, false).unwrap()', 1)
              path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veilid-http-stream/src/lib.rs
          git commit -m "Clarify stream corruption test naming"
          git push origin HEAD:agent/complete-veilid-http
