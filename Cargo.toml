[workspace]
resolver = "2"
members = [
  "crates/veilid-http-wire",
  "crates/veilid-http-core",
  "crates/veilid-http-transport",
  "crates/veilid-http-http",
  "crates/veilid-http-route",
  "crates/veilid-http-ipc",
  "crates/veilid-http-veilid-native",
  "crates/veilid-http-veilid-remote",
  "apps/veilid-http-native",
  "apps/veilid-http-bridge",
  "apps/veilid-http-cli",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
authors = ["VeilidHttp contributors"]
repository = "https://github.com/magiccodingman/VeilidHttp"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1.8"
bytes = { version = "1.10", features = ["serde"] }
data-encoding = "2.9"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
http = "1.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
